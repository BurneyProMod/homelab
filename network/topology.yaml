  - { a: sw-livrom, a_port: 3,  b: hue-bridge,  b_port: eth, note: "Philips Hue Bridge (in metal rack)" }
  - { a: sw-livrom, a_port: 7,  b: android-tv,  b_port: eth, note: "Android TV (left of metal rack)" }
