# ─────────────────────────────────────────────────────────────────────────────
# network/topology.yaml — PHYSICAL network topology (single source of truth).
#
# This file describes ONLY physical connections: which device is plugged into
# which switch port. It deliberately contains no transient data (no ping
# results, no DHCP state, no speeds). Those belong in devices.yaml and
# ip-addresses.yaml.
#
# Conventions:
#   - Devices are referenced by their permanent hostname (see devices.yaml).
#   - `a_port` / `b_port` are the physical ports on each end. "eth" = the
#     device's onboard NIC (for non-switch end devices). Unknown ports are
#     left blank and tracked as TODO.
#   - The Hallway SODOLA (sw-core) is the wall-port distribution panel: every
#     port except p1 (router) and p7 (AP) is a home-run to a wall jack in a
#     room. The wall run is recorded as a `note`.
#   - Locations: sw-core = hallway. sw-livrom/sw-kws/sw-kws-poe/burndev/
#     synology/proxmox hosts/kwsdisplay = Living Room (fed by SODOLA p6 wall
#     run). sw-masbed + its clients = Master Bedroom.
#
# Last verified: 2026-08-15 (physical description + switch-port mapper)
# ─────────────────────────────────────────────────────────────────────────────

links:
  # ── Router ─────────────────────────────────────────────────────────────────
  - { a: fw-opnsense, a_port: LAN,  b: sw-core, b_port: 1 }

  # ── sw-core wall runs (one wall port per room) ────────────────────────────
  - { a: sw-core, a_port: 2,  b: thewoober,     b_port: eth, note: "Kevin's bedroom (back bedroom) wall jack" }
  - { a: sw-core, a_port: 3,  b: hikvision,     b_port: eth, note: "Master bedroom hallway wall jack" }
  - { a: sw-core, a_port: 4,  b: sw-masbed,    b_port: 1,   note: "Master bedroom wall jack -> yuanley uplink" }
  - { a: sw-core, a_port: 5,  b: jeff-pc,       b_port: eth, note: "Front bedroom (Jeff's room) wall jack" }
  - { a: sw-core, a_port: 6,  b: sw-livrom,  b_port: "",  note: "Living room wall jack -> metal rack (TL-SG1024DE)" }
  # p7 = AP, direct
  - { a: sw-core, a_port: 7,  b: ap-hall,       b_port: eth, note: "U7 Pro, direct (not a wall run)" }

  # ── sw-livrom (TL-SG1024DE, metal rack, living room) ────────────────────
