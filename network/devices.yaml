# ─────────────────────────────────────────────────────────────────────────────
# network/devices.yaml — physical device inventory.
#
# One entry per PHYSICAL device. Virtual guests (LXCs/VMs) are NOT here — they
# ride on their Proxmox host's uplink and live in ip-addresses.yaml. For a
# guest's "switch port" see its host's uplink port here.
#
# Fields:
#   hostname        permanent operational name
#   mgmt_ip         management IP ("" = none)
#   mac             MAC address ("" = unknown, tracked TODO)
#   model           manufacturer + model
#   location        physical location
#   switch          parent switch hostname (or "" for the root/self)
#   switch_port     port on that switch (or "" if self)
#   speed           negotiated link speed (Gbps)
#   purpose         what it does
#   mgmt_url        management URL ("" = none)
#   poe             PoE powered yes/no
#   notes
#
# Last verified: 2026-08-15
# ─────────────────────────────────────────────────────────────────────────────

