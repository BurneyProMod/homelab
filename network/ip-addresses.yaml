# ─────────────────────────────────────────────────────────────────────────────
# network/ip-addresses.yaml — IP address plan (192.168.1.0/24).
#
# Classification (goal 10) + current assignments. Reference hostnames first,
# IPs second. Do NOT renumber anything yet — this is the as-built plan.
#
# DHCP pool (from OPNsense/dnsmasq backup, 2026-08-15):
#   LAN:   192.168.1.100 - 192.168.1.199
#   opt1:  192.168.2.50  - 192.168.2.199  ("MGMT VLAN DHCP")
#   opt4:  192.168.99.100- 192.168.99.199
#
# Current allocation map (see devices.yaml for hardware details).
# ─────────────────────────────────────────────────────────────────────────────

classes:
  networking:            "switches, router, APs, firewall"
  hypervisors:           "Proxmox host nodes"
  servers:               "physical standalone servers"
  vms_lxcs:              "virtual guests (LXCs/VMs) on Proxmox"
  home_automation:       "Home Assistant + IoT controllers"
  iot_wifi:              "WiFi IoT devices (cameras, plugs, sensors, printers)"
  trusted_clients:       "family PCs / workstations / phones"
  transient_dhcp:        "unidentified / intermittent DHCP clients"

# Reserved host addresses (low end of /24, not in DHCP pool)
reserved:
  - { ip: "192.168.1.1",   hostname: fw-opnsense,    class: networking,     assignment: static }
  - { ip: "192.168.1.2",   hostname: sw-core,        class: networking,     assignment: static, notes: "SODOLA 2.5G switch (mgmt)" }
  - { ip: "192.168.1.10",  hostname: caddy-vip,      class: networking,     assignment: static, notes: "keepalived VIP for *.burney.network (HA Caddy pair)" }
  - { ip: "192.168.1.11",  hostname: synology,       class: servers,        assignment: static }
  # 192.168.1.12 - 192.168.1.29 unused/reserved
  # WAN reference: LUS Fiber, public IP 76.72.62.249 (from homelabable ISP node)

