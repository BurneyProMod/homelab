apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: trilium-data
  namespace: tools
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trilium
  namespace: tools
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: trilium
  template:
    metadata:
      labels:
        app: trilium
    spec:
      securityContext:
        fsGroup: 1000
      containers:
      - name: trilium
        image: triliumnext/notes:v0.95.0
        command: ["node", "/usr/src/app/main.cjs"]
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        ports:
        - containerPort: 8080
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 1024Mi
        env:
        - name: TRILIUM_PORT
          value: '8080'
        volumeMounts:
        - name: data
          mountPath: /home/node/trilium-data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: trilium-data
---
apiVersion: v1
kind: Service
metadata:
  name: trilium-svc
  namespace: tools
spec:
  type: NodePort
  selector:
    app: trilium
  ports:
  - port: 80
    targetPort: 8080
    nodePort: 30081
