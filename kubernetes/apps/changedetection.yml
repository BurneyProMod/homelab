apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: changedetection-data
  namespace: default
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: changedetection
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: changedetection
  template:
    metadata:
      labels:
        app: changedetection
    spec:
      containers:
      - name: changedetection
        image: ghcr.io/dgtlmoon/changedetection.io:latest
        ports:
        - containerPort: 5000
        env:
        - name: BASE_URL
          value: https://changedetection.burney.network
        - name: PLAYWRIGHT_DRIVER_URL
          value: ws://changedetection-browser:3000
        - name: USE_X_SETTINGS
          value: "1"
        - name: TZ
          value: America/Chicago
        volumeMounts:
        - name: data
          mountPath: /datastore
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2048Mi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: changedetection-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: changedetection-browser
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: changedetection-browser
  template:
    metadata:
      labels:
        app: changedetection-browser
    spec:
      containers:
      - name: browser
        image: dgtlmoon/sockpuppetbrowser:latest
        securityContext:
          capabilities:
            add: ["SYS_ADMIN"]
        env:
        - name: SCREEN_WIDTH
          value: "1920"
        - name: SCREEN_HEIGHT
          value: "1080"
        - name: SCREEN_DEPTH
          value: "16"
        - name: MAX_CONCURRENT_CHROME_PROCESSES
          value: "4"
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1024Mi
---
apiVersion: v1
kind: Service
metadata:
  name: changedetection-browser
  namespace: default
spec:
  selector:
    app: changedetection-browser
  ports:
  - port: 3000
    targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: changedetection-svc
  namespace: default
spec:
  type: NodePort
  selector:
    app: changedetection
  ports:
  - port: 80
    targetPort: 5000
    nodePort: 30088
