apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: manyfold-data
  namespace: default
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: manyfold
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: manyfold
  template:
    metadata:
      labels:
        app: manyfold
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
      - name: chmod-data
        image: busybox:1.36
        command: ["sh", "-c", "chmod 0775 /config /models"]
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: data
          mountPath: /config
          subPath: config
        - name: data
          mountPath: /models
          subPath: models
      containers:
      - name: manyfold
        image: manyfold3d/manyfold:latest
        ports:
        - containerPort: 3214
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: SECRET_KEY_BASE
          valueFrom:
            secretKeyRef:
              name: manyfold-secret
              key: SECRET_KEY_BASE
        - name: REDIS_URL
          value: redis://manyfold-redis:6379/1
        - name: DATABASE_ADAPTER
          value: sqlite3
        - name: DATABASE_NAME
          value: /config/manyfold.sqlite3
        volumeMounts:
        - name: data
          mountPath: /config
          subPath: config
        - name: data
          mountPath: /models
          subPath: models
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2048Mi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: manyfold-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: manyfold-redis
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: manyfold-redis
  template:
    metadata:
      labels:
        app: manyfold-redis
    spec:
      containers:
      - name: redis
        image: redis:7
        command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: manyfold-redis
  namespace: default
spec:
  selector:
    app: manyfold-redis
  ports:
  - port: 6379
    targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: manyfold-svc
  namespace: default
spec:
  type: NodePort
  selector:
    app: manyfold
  ports:
  - port: 80
    targetPort: 3214
    nodePort: 30087
