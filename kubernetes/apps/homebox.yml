apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homebox-data
  namespace: default
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homebox
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homebox
  template:
    metadata:
      labels:
        app: homebox
    spec:
      containers:
      - name: homebox
        image: ghcr.io/sysadminsmedia/homebox:v0.26.2
        ports:
        - containerPort: 7745
        envFrom:
        - secretRef:
            name: homebox-secret
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: homebox-data
---
apiVersion: v1
kind: Service
metadata:
  name: homebox-svc
  namespace: default
spec:
  type: NodePort
  selector:
    app: homebox
  ports:
  - port: 80
    targetPort: 7745
    nodePort: 30086
