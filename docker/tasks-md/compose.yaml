# https://github.com/BaldissaraMatheus/Tasks.md
# Markdown-file-based task board (kanban). Tasks = markdown files, lanes = dirs.

services:
  tasks-md:
    image: baldissaramatheus/tasks.md:latest  # TODO: pin to versioned tag when available
    container_name: tasks.md
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - ./tasks:/tasks
      - ./config:/config
    restart: unless-stopped
    labels:
      - homepage.group=Productivity
      - homepage.name=Tasks.md
      - homepage.icon=tasks.png
      - homepage.href=https://tasks.burney.network
      - homepage.description=Markdown task board
