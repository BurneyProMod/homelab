services:
  actual_server:
    image: docker.io/actualbudget/actual-server:latest
    env_file: .env
    ports:
      # This line makes Actual available at port 5006 of the device you run the server on,
      # i.e. http://localhost:5006. You can change the first number to change the port, if you want.
      - '127.0.0.1:5006:5006'
    # Caddy terminates TLS; no in-app HTTPS needed.
    # See all options at https://actualbudget.org/docs/config/
    volumes:
      - ./data:/data
    healthcheck:
      test: ['CMD-SHELL', 'node scripts/health-check.js']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    labels:
      - homepage.group=Productivity
      - homepage.name=Actual Budget
      - homepage.icon=actual-budget.png
      - homepage.href=https://actual.burndev.lan
      - homepage.description=Personal finance
      - homepage.showStats=true
